name: personal fork checks

on:
  push:
    paths: ['personal/**', '.github/workflows/personal.yml']
  pull_request:
    paths: ['personal/**', '.github/workflows/personal.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater:
    if: github.repository == 'Volpestyle/herdr-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m unittest discover -s personal -p 'test_*.py'
